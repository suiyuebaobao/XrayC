services:
  postgres:
    image: ${XRAYC_REGISTRY}/xrayc/postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: xrayc
      POSTGRES_DB: xrayc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["0.0.0.0:5432:5432"]
    volumes: ["xrayc_db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xrayc -d xrayc"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes: {xrayc_db_data: {}}
