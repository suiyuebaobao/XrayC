services:
  postgres:
    image: ${XRAYC_REGISTRY}/xrayc/postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: xrayc
      POSTGRES_DB: xrayc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["xrayc_db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xrayc -d xrayc"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    image: ${XRAYC_REGISTRY}/xrayc/rust-app:trial
    restart: always
    command: ["xrayc-worker"]
    environment:
      DATABASE_URL: "postgres://xrayc:${POSTGRES_PASSWORD}@postgres:5432/xrayc"
      MIGRATIONS_DIR: migrations
      XRAYC_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' </proc/1/cmdline | grep -q xrayc-worker"]
      interval: 30s
      timeout: 5s
      retries: 3
  api:
    image: ${XRAYC_REGISTRY}/xrayc/rust-app:trial
    restart: always
    command: ["xrayc-api"]
    environment:
      API_BIND: 0.0.0.0:3000
      DATABASE_URL: "postgres://xrayc:${POSTGRES_PASSWORD}@postgres:5432/xrayc"
      XRAYC_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      XRAYC_REFRESH_COOKIE_SECURE: "true"
      XRAYC_PUBLIC_BASE_URL: ${XRAYC_PUBLIC_BASE_URL}
      SEED_DEMO_DATA: "false"
      XRAYC_BOOTSTRAP_ADMIN_PASSWORD: ${XRAYC_BOOTSTRAP_ADMIN_PASSWORD}
      # 监控中心平台指标:磁盘占用读宿主 FS 根(下方 / 只读挂到 /hostfs);/proc 容器内即宿主不挂。
      XRAYC_HOST_FS_ROOT: /hostfs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      # 只读挂宿主根目录,供平台指标 statvfs 读真实宿主磁盘占用(只读、不可写)。
      - "/:/hostfs:ro"
  caddy:
    image: ${XRAYC_REGISTRY}/xrayc/caddy:trial
    restart: always
    environment:
      CADDY_SITE_ADDRESS: ${PANEL_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: ["xrayc_caddy_data:/data", "xrayc_caddy_config:/config"]
    depends_on: [api]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://${PANEL_DOMAIN}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  xrayc_db_data: {}
  xrayc_caddy_data: {}
  xrayc_caddy_config: {}
